<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Rob LeGood</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/blog.css">
</head>
<body>

    <nav></nav>

    <main>
        <div class="rl-blog-layout">
            <aside class="rl-blog-sidebar">
                <div class="rl-blog-sidebar-header">
                    <h2>Posts</h2>
                    <div class="rl-blog-filter-controls">
                        <button class="rl-blog-clear-btn" id="blog-clear-btn" title="Clear filters">&times;</button>
                        <button class="rl-blog-filter-btn" id="blog-filter-btn" title="Filter posts">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                            </svg>
                            <span class="rl-blog-filter-count" id="blog-filter-count"></span>
                        </button>
                    </div>
                </div>
                <ul class="rl-blog-nav-list" id="blog-nav-list">
                    <li class="rl-blog-nav-loading">Loading posts...</li>
                </ul>
            </aside>
            <article class="rl-blog-content" id="blog-content">
                <div class="rl-blog-loading">Loading...</div>
            </article>
        </div>
    </main>

    <footer>
        &copy; 1972-2026 Rob LeGood. Hosted on Cloudflare Pages.
    </footer>

    <!-- Filter Modal -->
    <div class="rl-blog-modal-overlay" id="blog-filter-modal">
        <div class="rl-blog-modal">
            <div class="rl-blog-modal-header">
                <h3>Filter Posts</h3>
                <button class="rl-blog-modal-close" id="blog-modal-close">&times;</button>
            </div>
            <div class="rl-blog-modal-body" id="blog-filters"></div>
        </div>
    </div>

    <script src="scripts/nav.js"></script>
    <script src="scripts/blog.js"></script>
    <script src="scripts/random-title.js"></script>

</body>
</html>
