<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* Reset and Base Styles */
        body, html {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            background-color: #f4f4f9;
        }

        /* Centering Container */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            padding: 0 20px;
        }

        /* Typography */
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        p {
            font-size: 1.25rem;
            color: #666;
            margin-bottom: 2rem;
            max-width: 600px;
            line-height: 1.6;
        }

        /* Optional: A simple button style if you want a call to action */
        .btn {
            padding: 12px 24px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #1a252f;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Something Awesome is Brewing</h1>
        <p>We are currently working on creating something fantastic. We will be launching soon, so check back later.</p>
        <a href="mailto:contact@example.com" class="btn">Contact Us</a>
    </div>

</body>
</html>
